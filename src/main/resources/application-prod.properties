# 운영 프로파일 - 모든 값은 배포 환경(Render/Neon 콘솔 등)에서 주입되는 환경변수 플레이스홀더만 사용한다.
# 이 파일에는 실제 값(비밀번호/URL 등)을 절대 직접 쓰지 않는다. 기본값(:default)도 두지 않아
# 환경변수가 누락되면 기동 시점에 바로 실패하도록 한다 (운영 환경에서 값 누락을 조용히 넘기지 않기 위함).

## PostgreSQL (Neon 등 운영 DB)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

## 로깅 (logback-spring.xml의 "prod" springProfile에서 STDOUT 전용 출력 - 파일 로깅 없음)
logging.level.com.example.demo=INFO
logging.level.root=WARN
