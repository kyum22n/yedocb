# 로컬 개발 프로파일 (기본 활성 프로파일 - spring.profiles.active 미설정 시 자동 사용)

## PostgreSQL (로컬 개발 DB - 운영 값 아님, 커밋해도 무방)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/yedocb
spring.datasource.username=postgres
spring.datasource.password=postgres

## 로깅 (logback-spring.xml의 "local" springProfile에서 콘솔+로컬 파일 출력)
logging.level.com.example.demo=DEBUG
