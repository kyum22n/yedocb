spring.application.name=yedocb
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# 서버 포트 (Render 등 PaaS는 PORT 환경변수로 포트를 주입함)
server.port=${PORT:8080}

## MyBatis
mybatis.mapper-locations=classpath*:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

## 스키마 초기화 (schema.sql, 존재하지 않는 테이블만 생성 - idempotent, Flyway/Liquibase 미도입)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

## JWT (로컬 개발 기본값 - 운영값 아님. application-prod.properties는 기본값 없는 ${ENV_VAR}만 사용)
jwt.secret=${JWT_SECRET:bG9jYWwtZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0xMjM0NTY3ODkw}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

## CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

## OAuth2 (로컬에서는 미설정 시 빈 값 - OAuthController가 기본값 ""로 동작, 실제 로그인 시도 시 실패만 함)
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:}
kakao.client.id=${KAKAO_CLIENT_ID:}
kakao.redirect.uri=${KAKAO_REDIRECT_URI:}
